name: Build Custom Images

on:
  push:
    branches:
      - '**'
    paths:
      - images/restapi/Dockerfile
      - images/restapi/requirements.txt
      - images/timescaledb/**
      - src/www/Dockerfile
      - src/www/requirements.txt
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: broker-python-base
            context: .
            dockerfile: images/restapi/Dockerfile
            cache_scope: broker-python-base
          - image_name: broker-mgmt-app
            context: .
            dockerfile: src/www/Dockerfile
            cache_scope: broker-mgmt-app
          - image_name: timescaledb
            context: images/timescaledb
            dockerfile: images/timescaledb/Dockerfile
            cache_scope: timescaledb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SAFE_REF=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          TAGS="ghcr.io/${OWNER_LC}/${{ matrix.image_name }}:branch-${SAFE_REF},ghcr.io/${OWNER_LC}/${{ matrix.image_name }}:sha-${{ github.sha }}"
          if [ '${{ github.ref_name }}' = 'main' ]; then
            TAGS="${TAGS},ghcr.io/${OWNER_LC}/${{ matrix.image_name }}:main"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: false
