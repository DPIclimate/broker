name: Docker Compose Actions Workflow
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Create python-base image
        run: docker build -q -t broker/python-base -f images/restapi/Dockerfile .
      - name: Create timescaledb
        run: docker build -q -t timescaledb -f images/timescaledb/Dockerfile images/timescaledb
      - name: Create webapp image
        run: docker build -q -t broker/mgmt-app -f src/www/Dockerfile .
      - name: Build the stack
        run: docker compose -f compose/docker-compose.yml up -d
      - name: Unit tests
        run: docker exec compose-x-1 pytest
