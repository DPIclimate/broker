services:
  db:
    image: timescaledb
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../db/init.d:/docker-entrypoint-initdb.d
      - ../db/upgrade:/upgrade
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${PGDATABASE}", "-U", "${PGUSER}" ]
      timeout: 45s
      interval: 120s
      retries: 10
      start_period: 30s
      start_interval: 1s

  mq:
    hostname: "mq"
    image: rabbitmq:3.9-management
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../config/rabbitmq:/etc/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity || exit 1
      interval: 120s
      start_period: 30s
      start_interval: 1s

  restapi:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - "db"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python/restapi"
    entrypoint: [ "/home/broker/.local/bin/uvicorn", "--proxy-headers", "--host", "0.0.0.0", "--port", "5687", "RestAPI:app" ]

  website:
    image: broker/mgmt-app
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/iota
    depends_on:
      db:
        condition: "service_healthy"
    volumes:
      - ../src/www:/app
      - ../src/python:/iota

  ttn_webhook:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - ttn
    depends_on:
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python/ttn"
    entrypoint: [ "/home/broker/.local/bin/uvicorn", "--proxy-headers", "--host", "0.0.0.0", "--port", "5688", "WebHook:app" ]

  ttn_processor:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - ttn
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python/ttn"
    entrypoint: [ "python", "AllMsgsWriter.py" ]

  ydoc:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - ydoc
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python"
    entrypoint: [ "python", "-m", "ydoc.YDOC" ]

  wombat:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles: ["wombat", "frred"]
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python"
    entrypoint: [ "python", "-m", "ydoc.Wombat" ]

  dragino_json:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - dragino_json
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python"
    entrypoint: [ "python", "-m", "ydoc.Dragino_JSON" ]


  lm:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python"
    entrypoint: [ "python", "-m", "logical_mapper.LogicalMapper" ]

  delivery:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - ubidots
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python"
    entrypoint: [ "python", "-m", "delivery.UbidotsWriter" ]

  pollers:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - pollers
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python"
    entrypoint: [ "python", "-m", "pollers.ICT_EagleIO" ]

  frred:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - frred
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
      - ${DATABOLT_SHARED_DIR}/nectar_raw_data:/raw_data
    working_dir: "/home/broker/python"
    entrypoint: [ "python", "-m", "delivery.FRRED" ]

  axistech:
    image: broker/python-base
    logging:
      driver: local
      options:
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    profiles:
      - frred
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ../src/python:/home/broker/python
    working_dir: "/home/broker/python"
    entrypoint: [ "python", "-m", "pollers.axistech" ]


  thingsboard:
      image: broker/python-base
      logging:
        driver: local
        options:
          max-file: "3"
      restart: unless-stopped
      env_file:
        - .env
      depends_on:
        db:
          condition: "service_healthy"
      volumes:
        - ../src/python:/home/broker/python
      working_dir: "/home/broker/python"
      entrypoint: [ "python", "-m", "delivery.thingsboard", "--host", "tb.farmdecisiontech.net.au", "--port", "8883" ]


  test:
    image: broker/python-base
    profiles:
      - test
    restart: "no"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/home/broker/broker/src/python:/home/broker/broker/test/python
    depends_on:
      db:
        condition: "service_healthy"
      mq:
        condition: "service_healthy"
    volumes:
      - ..:/home/broker/broker
    working_dir: "/home/broker/broker"
    entrypoint: [ "./forever.sh" ]
